name: DeathbanEnchants
version: '2.0.0'
main: id.deathban.enchants.DeathbanEnchants
api-version: '1.21'
author: Deathban
description: Custom enchantment plugin

commands:
  denchants:
    description: Mengelola custom enchantment
    usage: /denchants <help|list|book|apply>
    permission: deathbanenchants.admin

permissions:
  deathbanenchants.admin:
    description: Menggunakan seluruh command DeathbanEnchants
    default: op
